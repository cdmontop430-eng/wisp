<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D4C Embed Builder</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- ================= Login overlay (shown until dashboard key is entered) ================= -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <h1>D4C Embed Builder</h1>
      <p class="muted">Enter your dashboard key to continue.</p>
      <input type="password" id="login-key" placeholder="Dashboard key" autocomplete="off" />
      <button id="login-btn" class="btn btn-primary">Unlock</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <!-- ================= Main app ================= -->
  <div id="app" class="app hidden">
    <!-- Header -->
    <header class="app-header">
      <h1>D4C Embed Builder</h1>
      <div class="header-right">
        <span id="channel-status" class="channel-status muted">No channel set</span>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Lock</button>
      </div>
    </header>

    <div class="layout">
      <!-- ================= Left: Builder panel ================= -->
      <main class="builder">
        <!-- Target channel -->
        <section class="card">
          <h2>Target Channel</h2>
          <div class="row">
            <input type="text" id="channel-id" placeholder="Paste Discord Channel ID (e.g. 123456789012345678)" />
            <button id="validate-channel-btn" class="btn btn-secondary btn-sm">Check</button>
          </div>
        </section>

        <!-- Template selector -->
        <section class="card">
          <h2>Templates</h2>
          <div class="template-grid">
            <button class="template-btn" data-template="announcement">
              <span class="template-icon">📢</span>
              <span class="template-name">Announcement</span>
            </button>
            <button class="template-btn" data-template="event">
              <span class="template-icon">🎉</span>
              <span class="template-name">Event</span>
            </button>
            <button class="template-btn" data-template="giveaway">
              <span class="template-icon">🎁</span>
              <span class="template-name">Giveaway</span>
            </button>
            <button class="template-btn" data-template="welcome">
              <span class="template-icon">👋</span>
              <span class="template-name">Welcome</span>
            </button>
            <button class="template-btn" data-template="changelog">
              <span class="template-icon">📝</span>
              <span class="template-name">Changelog</span>
            </button>
            <button class="template-btn" data-template="rules">
              <span class="template-icon">📜</span>
              <span class="template-name">Rules</span>
            </button>
          </div>
        </section>

        <!-- Embed title -->
        <section class="card">
          <h2>Embed Title</h2>
          <input type="text" id="embed-title" placeholder="Announcement title" maxlength="256" />
          <h2>Description <span class="muted">(optional)</span></h2>
          <textarea id="embed-description" rows="2" placeholder="Short intro text shown above the sections" maxlength="4096"></textarea>
        </section>

        <!-- Sections container -->
        <section class="card">
          <div class="card-header">
            <h2>Sections</h2>
            <button id="add-section-btn" class="btn btn-success btn-sm">+ Add Section</button>
          </div>
          <div id="sections-container"></div>
        </section>

        <!-- Send button -->
        <div class="send-row">
          <button id="send-btn" class="btn btn-primary btn-lg">Send to Discord</button>
          <span id="send-status" class="muted"></span>
        </div>
      </main>

      <!-- ================= Right: Live preview ================= -->
      <aside class="preview-panel">
        <h2 class="preview-title">Live Preview</h2>
        <div class="discord-preview" id="preview">
          <div class="discord-message">
            <div class="discord-avatar"></div>
            <div class="discord-content">
              <div class="discord-header">
                <span class="discord-username">D4C Bot</span>
                <span class="discord-bot-badge">BOT</span>
                <span class="discord-timestamp">Today at 12:00</span>
              </div>
              <div class="discord-embed" id="preview-embed">
                <div class="embed-color-bar"></div>
                <div class="embed-inner">
                  <div class="embed-title" id="preview-title">Your Title Here</div>
                  <div class="embed-description" id="preview-description"></div>
                  <div class="embed-fields" id="preview-fields"></div>
                  <div class="embed-image" id="preview-image-wrapper" style="display:none">
                    <img id="preview-image" src="" alt="embed image" />
                  </div>
                  <div class="embed-footer" id="preview-footer">D4C Dashboard</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- ================= Toast container ================= -->
  <div id="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
